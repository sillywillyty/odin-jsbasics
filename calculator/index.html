<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">

  <div class="display">
    <div id="previousOperand" class="previousOperand"></div>
    <div id="currentOperand" class="currentOperand">0</div>
  </div>

  <button id="clearButton" class="span-two">AC</button>
  <button id="backspaceButton">DEL</button>
  <button data-operator="/" class="operatorButton">÷</button>

  <button data-number="7" class="numberButton">7</button>
  <button data-number="8" class="numberButton">8</button>
  <button data-number="9" class="numberButton">9</button>
  <button data-operator="*" class="operatorButton">×</button>

  <button data-number="4" class="numberButton">4</button>
  <button data-number="5" class="numberButton">5</button>
  <button data-number="6" class="numberButton">6</button>
  <button data-operator="-" class="operatorButton">-</button>

  <button data-number="1" class="numberButton">1</button>
  <button data-number="2" class="numberButton">2</button>
  <button data-number="3" class="numberButton">3</button>
  <button data-operator="+" class="operatorButton">+</button>

  <button data-number="0" class="numberButton span-two">0</button>
  <button data-number="." class="numberButton">.</button>
  <button id="equalsButton" class="equalsButton">=</button>

</div>

<script src="script.js"></script>
</body>
</html>
